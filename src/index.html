<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心动拼豆手账 Demo</title>
    <link rel="stylesheet" href="./styles.css?v=20260525-fixed-levels-2" />
  </head>
  <body>
    <main class="app-shell">
      <nav class="mode-tabs" aria-label="工作区切换">
        <button class="tab-button active" id="homeTab" type="button">关卡入口</button>
        <button class="tab-button" id="generatorTab" type="button">关卡生成器</button>
        <button class="tab-button" id="gameTab" type="button">试玩游戏</button>
      </nav>

      <section class="home-view" id="homeView">
        <div class="home-phone">
          <header class="home-status">
            <button class="home-icon-button" type="button" aria-label="设置">⚙</button>
            <div class="status-pill"><span class="coin-dot"></span><span id="homeCoin">2</span></div>
            <div class="status-pill"><span class="heart-dot"></span><span>5/5</span></div>
            <button class="home-icon-button small" type="button" aria-label="声音">♪</button>
          </header>

          <section class="brand-stage">
            <h1 class="game-logo">心动<br />拼豆手账</h1>
            <div class="sticker-preview-shell">
              <img class="home-original-preview hidden" id="homeOriginalPreview" alt="当前关卡原图预览" />
              <div class="home-pattern-board" id="homePatternBoard"></div>
            </div>
          </section>

          <section class="home-actions">
            <div class="side-actions left-actions" aria-label="活动入口">
              <button class="round-action" type="button"><span>⏰</span><b>限时活动</b></button>
              <button class="round-action" type="button"><span>💬</span><b>加桌有礼</b></button>
              <button class="round-action" type="button"><span>🎁</span><b>入口奖励</b></button>
              <button class="round-action" type="button"><span>🍰</span><b>换皮肤</b></button>
            </div>

            <div class="main-actions">
              <div class="level-selector" id="homeLevelSelector">
                <button class="level-chip active" type="button" data-level="1">1</button>
                <button class="level-chip" type="button" data-level="2">2</button>
                <button class="level-chip" type="button" data-level="3">3</button>
              </div>
              <button class="daily-button" type="button">每日挑战 <small>今日免费：1/1</small></button>
              <button class="start-level-button" id="startLevelButton" type="button">第<span id="homeLevelNumber">1</span>关</button>
            </div>

            <div class="side-actions right-actions" aria-label="功能入口">
              <button class="round-action" type="button"><span>🧩</span><b>消除拼豆</b></button>
              <button class="round-action" type="button"><span>🔤</span><b>猜词</b></button>
              <button class="round-action" type="button"><span>📘</span><b>我的作品</b></button>
              <button class="round-action" type="button"><span>🏆</span><b>排行榜</b></button>
            </div>
          </section>
        </div>
      </section>

      <section class="generator-view hidden" id="generatorView">
        <header class="generator-header">
          <div>
            <h1>图片关卡生成器</h1>
            <p>导入图片，生成拼豆底图和可试玩关卡。</p>
          </div>
          <button class="primary-button" id="playGeneratedButton" type="button">进入试玩</button>
        </header>

        <section class="generator-layout">
          <aside class="control-panel">
            <label class="control-block">
              <span>关卡</span>
              <select id="levelSelect">
                <option value="1">关卡 1</option>
                <option value="2">关卡 2</option>
                <option value="3">关卡 3</option>
              </select>
            </label>

            <label class="control-block file-control">
              <span>导入图片</span>
              <input id="imageInput" type="file" accept="image/*" />
            </label>

            <div class="control-grid">
              <label class="control-block">
                <span>宽度(珠子数)</span>
                <input id="widthInput" type="number" min="8" max="80" value="50" />
              </label>
              <label class="control-block">
                <span>高度(珠子数)</span>
                <input id="heightInput" type="number" value="49" readonly />
              </label>
            </div>

            <label class="control-block">
              <span>最大颜色数</span>
              <input id="maxColorsInput" type="number" min="0" max="64" value="0" />
              <small>0 = 不限制，使用采样调色板</small>
            </label>

            <fieldset class="fieldset">
              <legend>图片调整</legend>
              <label class="slider-row">
                <span>水平移动</span>
                <input id="offsetXInput" type="range" min="-50" max="50" value="0" />
                <output id="offsetXValue">0</output>
              </label>
              <label class="slider-row">
                <span>垂直移动</span>
                <input id="offsetYInput" type="range" min="-50" max="50" value="0" />
                <output id="offsetYValue">0</output>
              </label>
              <label class="slider-row">
                <span>图片缩放</span>
                <input id="imageScaleInput" type="range" min="40" max="240" value="100" />
                <output id="imageScaleValue">100</output>
              </label>
              <label class="slider-row">
                <span>亮度</span>
                <input id="brightnessInput" type="range" min="-60" max="60" value="0" />
                <output id="brightnessValue">0</output>
              </label>
              <label class="slider-row">
                <span>对比度</span>
                <input id="contrastInput" type="range" min="-60" max="80" value="0" />
                <output id="contrastValue">0</output>
              </label>
              <label class="slider-row">
                <span>饱和度</span>
                <input id="saturationInput" type="range" min="-80" max="120" value="0" />
                <output id="saturationValue">0</output>
              </label>
            </fieldset>

            <fieldset class="fieldset">
              <legend>显示选项</legend>
              <label class="check-row">
                <input id="showCodesInput" type="checkbox" checked />
                <span>显示颜色代码</span>
              </label>
              <label class="check-row">
                <input id="showGridInput" type="checkbox" checked />
                <span>显示网格线</span>
              </label>
              <label class="check-row">
                <input id="showSplitInput" type="checkbox" />
                <span>显示拼豆板分割线(29x29)</span>
              </label>
            </fieldset>

            <button class="primary-button full-width" id="generateButton" type="button">生成关卡图案</button>
          </aside>

          <section class="preview-panel">
            <div class="preview-meta" id="previewMeta">等待生成</div>
            <div class="pattern-window">
              <div class="pattern-board show-codes show-grid" id="patternBoard"></div>
            </div>
          </section>
        </section>
      </section>

      <section class="game-view hidden" id="gameView">
        <div class="game-shell">
          <header class="top-bar">
            <div class="coin-pill">金币: <span id="coinCount">0</span></div>
            <div class="title">心动拼豆手账</div>
            <div class="timer-pill">⏱ <span id="timer">10:00</span></div>
          </header>

          <section class="board-section" id="boardSection">
            <button class="zoom-button" id="zoomButton" type="button" aria-label="放大棋盘">🔍</button>
            <label class="zoom-slider hidden" id="zoomSliderWrap">
              <span>放大</span>
              <input id="zoomScaleInput" type="range" min="100" max="150" value="120" />
            </label>
            <div class="board-window" id="boardWindow">
              <div class="board" id="board"></div>
            </div>
          </section>

          <section class="tray-section" aria-label="暂存格">
            <div class="tray" id="tray"></div>
          </section>

          <footer class="tool-bar" aria-label="道具栏">
            <button class="tool-button" type="button" aria-label="框选归位">🎯</button>
            <button class="tool-button" type="button" aria-label="清空槽位">🧹</button>
            <button class="tool-button" type="button" aria-label="消色">🌈</button>
          </footer>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" aria-live="polite"></div>

    <div class="modal hidden" id="resultModal">
      <div class="modal-panel result-panel" id="resultPanel">
        <button class="modal-close" id="modalCloseButton" type="button" aria-label="关闭">×</button>
        <div class="result-banner" id="resultBanner">贴纸复原完成</div>
        <div class="result-celebration hidden" id="resultCelebration" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="result-sticker hidden" id="resultSticker">
          <img id="resultStickerImage" alt="完成贴纸" />
        </div>
        <div class="result-cat" id="resultCat">🐱</div>
        <h1 id="resultTitle">贴纸复原完成</h1>
        <p id="resultText">获得猫咪手账贴纸，金币 +30</p>
        <button id="restartButton" type="button">再玩一次</button>
      </div>
    </div>

    <script src="./main.js?v=20260525-fixed-levels-2"></script>
  </body>
</html>
