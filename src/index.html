<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>猫猫罐头小铺 Demo</title>
    <link rel="stylesheet" href="./styles.css?v=20260528-success-modal-align-1" />
  </head>
  <body>
    <main class="app-shell">
      <nav class="mode-tabs" aria-label="工作区切换">
        <button class="tab-button active" id="homeTab" type="button">关卡入口</button>
        <button class="tab-button" id="generatorTab" type="button">关卡生成器</button>
        <button class="tab-button" id="gameTab" type="button">试玩游戏</button>
      </nav>

      <section class="home-view" id="homeView">
        <div class="home-phone">
          <header class="home-status">
            <div class="player-card">
              <img class="player-card-art" src="./assets/ui/level-entry/player-level-crop.png" alt="" />
              <span class="paw-badge">🐾</span>
              <strong id="homePlayerLevel">LV.1</strong>
              <span class="level-exp"><i></i></span>
            </div>
            <div class="status-pill coin-status"><span class="coin-dot"></span><span id="homeCoin">0</span></div>
            <button class="home-icon-button small" type="button" aria-label="设置"></button>
          </header>

          <section class="brand-stage">
            <h1 class="game-logo"><small>NEKO CAN SHOP</small>猫猫罐头小铺</h1>
          </section>

          <section class="home-actions">
            <div class="level-scroll-panel">
              <div class="level-selector" id="homeLevelSelector">
                <button class="level-chip active" type="button" data-level="1">
                  <span class="level-copy"><small>Level</small><b>1</b></span>
                  <span class="level-art"><img src="./assets/level-1.png" alt="Level 1" /></span>
                  <span class="level-state">NEXT</span>
                  <span class="level-progress"><i></i><em>0%</em></span>
                </button>
                <button class="level-chip" type="button" data-level="2">
                  <span class="level-copy"><small>Level</small><b>2</b></span>
                  <span class="level-art"><img src="./assets/level-2.png" alt="Level 2" /></span>
                  <span class="level-state locked-state">🔒</span>
                  <span class="level-progress"><i></i><em>0%</em></span>
                </button>
                <button class="level-chip" type="button" data-level="3">
                  <span class="level-copy"><small>Level</small><b>3</b></span>
                  <span class="level-art"><img src="./assets/level-3.png" alt="Level 3" /></span>
                  <span class="level-state locked-state">🔒</span>
                  <span class="level-progress"><i></i><em>0%</em></span>
                </button>
                <button class="level-chip" type="button" data-level="4"><span class="level-copy"><small>Level</small><b>4</b></span><span class="level-art"><img src="./assets/level-4.png" alt="Level 4" /></span><span class="level-state locked-state">🔒</span><span class="level-progress"><i></i><em>0%</em></span></button>
                <button class="level-chip" type="button" data-level="5"><span class="level-copy"><small>Level</small><b>5</b></span><span class="level-art"><img src="./assets/level-5.png" alt="Level 5" /></span><span class="level-state locked-state">🔒</span><span class="level-progress"><i></i><em>0%</em></span></button>
                <button class="level-chip" type="button" data-level="6"><span class="level-copy"><small>Level</small><b>6</b></span><span class="level-art"><img src="./assets/level-6.png" alt="Level 6" /></span><span class="level-state locked-state">🔒</span><span class="level-progress"><i></i><em>0%</em></span></button>
                <button class="level-chip" type="button" data-level="7"><span class="level-copy"><small>Level</small><b>7</b></span><span class="level-art"><img src="./assets/level-7.png" alt="Level 7" /></span><span class="level-state locked-state">🔒</span><span class="level-progress"><i></i><em>0%</em></span></button>
                <button class="level-chip" type="button" data-level="8"><span class="level-copy"><small>Level</small><b>8</b></span><span class="level-art"><img src="./assets/level-8.png" alt="Level 8" /></span><span class="level-state locked-state">🔒</span><span class="level-progress"><i></i><em>0%</em></span></button>
                <button class="level-chip" type="button" data-level="9"><span class="level-copy"><small>Level</small><b>9</b></span><span class="level-art"><img src="./assets/level-9.png" alt="Level 9" /></span><span class="level-state locked-state">🔒</span><span class="level-progress"><i></i><em>0%</em></span></button>
                <button class="level-chip" type="button" data-level="10"><span class="level-copy"><small>Level</small><b>10</b></span><span class="level-art"><img src="./assets/level-10.png" alt="Level 10" /></span><span class="level-state locked-state">🔒</span><span class="level-progress"><i></i><em>0%</em></span></button>
              </div>
            </div>
          </section>

          <nav class="home-bottom-nav" aria-label="主功能">
            <button class="active" type="button"><img src="./assets/ui/level-entry/nav-home-crop.png" alt="主页" /></button>
            <button type="button"><img src="./assets/ui/level-entry/nav-shop-crop.png" alt="店铺" /></button>
            <button type="button"><img src="./assets/ui/level-entry/nav-can-crop.png" alt="罐头" /></button>
            <button type="button"><img src="./assets/ui/level-entry/nav-journal-crop.png" alt="手账" /></button>
          </nav>
        </div>
      </section>

      <section class="generator-view hidden" id="generatorView">
        <header class="generator-header">
          <div>
            <h1>图片关卡生成器</h1>
            <p>导入图片，生成拼豆底图和可试玩关卡。</p>
          </div>
          <button class="primary-button" id="playGeneratedButton" type="button">进入试玩</button>
        </header>

        <section class="generator-layout">
          <aside class="control-panel">
            <label class="control-block">
              <span>关卡</span>
              <select id="levelSelect">
                <option value="1">关卡 1</option>
                <option value="2">关卡 2</option>
                <option value="3">关卡 3</option>
                <option value="4">关卡 4</option>
                <option value="5">关卡 5</option>
                <option value="6">关卡 6</option>
                <option value="7">关卡 7</option>
                <option value="8">关卡 8</option>
                <option value="9">关卡 9</option>
                <option value="10">关卡 10</option>
              </select>
            </label>

            <label class="control-block file-control">
              <span>导入图片</span>
              <input id="imageInput" type="file" accept="image/*" />
            </label>

            <div class="control-grid">
              <label class="control-block">
                <span>宽度(珠子数)</span>
                <input id="widthInput" type="number" min="8" max="80" value="50" />
              </label>
              <label class="control-block">
                <span>高度(珠子数)</span>
                <input id="heightInput" type="number" value="49" readonly />
              </label>
            </div>

            <label class="control-block">
              <span>最大颜色数</span>
              <input id="maxColorsInput" type="number" min="0" max="64" value="0" />
              <small>0 = 不限制，使用采样调色板</small>
            </label>

            <fieldset class="fieldset">
              <legend>图片调整</legend>
              <label class="slider-row">
                <span>水平移动</span>
                <input id="offsetXInput" type="range" min="-50" max="50" value="0" />
                <output id="offsetXValue">0</output>
              </label>
              <label class="slider-row">
                <span>垂直移动</span>
                <input id="offsetYInput" type="range" min="-50" max="50" value="0" />
                <output id="offsetYValue">0</output>
              </label>
              <label class="slider-row">
                <span>图片缩放</span>
                <input id="imageScaleInput" type="range" min="40" max="240" value="100" />
                <output id="imageScaleValue">100</output>
              </label>
              <label class="slider-row">
                <span>亮度</span>
                <input id="brightnessInput" type="range" min="-60" max="60" value="0" />
                <output id="brightnessValue">0</output>
              </label>
              <label class="slider-row">
                <span>对比度</span>
                <input id="contrastInput" type="range" min="-60" max="80" value="0" />
                <output id="contrastValue">0</output>
              </label>
              <label class="slider-row">
                <span>饱和度</span>
                <input id="saturationInput" type="range" min="-80" max="120" value="0" />
                <output id="saturationValue">0</output>
              </label>
            </fieldset>

            <fieldset class="fieldset">
              <legend>显示选项</legend>
              <label class="check-row">
                <input id="showCodesInput" type="checkbox" checked />
                <span>显示颜色代码</span>
              </label>
              <label class="check-row">
                <input id="showGridInput" type="checkbox" checked />
                <span>显示网格线</span>
              </label>
              <label class="check-row">
                <input id="showSplitInput" type="checkbox" />
                <span>显示拼豆板分割线(29x29)</span>
              </label>
            </fieldset>

            <button class="primary-button full-width" id="generateButton" type="button">生成关卡图案</button>
          </aside>

          <section class="preview-panel">
            <div class="preview-meta" id="previewMeta">等待生成</div>
            <div class="pattern-window">
              <div class="pattern-board show-codes show-grid" id="patternBoard"></div>
            </div>
          </section>
        </section>
      </section>

      <section class="game-view hidden" id="gameView">
        <div class="game-shell">
          <header class="top-bar">
            <div class="game-level-pill"><span id="gamePlayerLevelLabel">LV.1</span></div>
            <div class="game-stage-label" id="gameLevelLabel">第1关</div>
            <div class="coin-pill"><span id="coinCount">0</span></div>
            <div class="timer-pill"><span id="timer">10:00</span></div>
            <button class="game-back-button" id="returnHomeButton" type="button" aria-label="返回主页"></button>
          </header>

          <section class="board-section" id="boardSection">
            <button class="zoom-button" id="zoomButton" type="button" aria-label="放大棋盘"></button>
            <label class="zoom-slider hidden" id="zoomSliderWrap">
              <input id="zoomScaleInput" type="range" min="100" max="150" value="120" />
            </label>
            <div class="board-window" id="boardWindow">
              <div class="board" id="board"></div>
            </div>
          </section>

          <section class="tray-section" aria-label="暂存格">
            <div class="tray" id="tray"></div>
          </section>

          <footer class="tool-bar" aria-label="道具栏">
            <button class="tool-button area-tool-button" type="button" data-tool="area" aria-label="框选归位"></button>
            <button class="tool-button clear-tray-tool-button" type="button" data-tool="clear-tray" aria-label="清空槽位"></button>
            <button class="tool-button clear-color-tool-button" type="button" data-tool="clear-color" aria-label="消色"></button>
          </footer>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" aria-live="polite"></div>

    <div class="modal hidden" id="resultModal">
      <div class="modal-panel result-panel" id="resultPanel">
        <button class="modal-close" id="modalCloseButton" type="button" aria-label="关闭">×</button>
        <div class="result-banner" id="resultBanner">贴纸复原完成</div>
        <div class="result-celebration hidden" id="resultCelebration" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="result-sticker hidden" id="resultSticker">
          <img id="resultStickerImage" alt="完成贴纸" />
        </div>
        <div class="result-cat" id="resultCat">🐱</div>
        <h1 id="resultTitle">贴纸复原完成</h1>
        <p id="resultText">获得猫咪手账贴纸，金币 +30</p>
        <button id="restartButton" type="button">再玩一次</button>
      </div>
    </div>

    <script src="./assets/levels/fixed-levels.js?v=20260526-fixed-player-levels-2"></script>
    <script src="./main.js?v=20260528-success-modal-align-1"></script>
  </body>
</html>
